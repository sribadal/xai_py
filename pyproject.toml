[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-decision-making"
version = "0.1.0"
description = "XAI for decision-making in oncology"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn==1.7.1",
  "scipy",
  "matplotlib",
  "seaborn",
  "shap",
  "torch",
  "scikit-survival",
  "masurvival==0.1.2",
  "tqdm>=4.67.3",
  "lime>=0.2.0.1",
  "survshap>=0.4.2",
  "sage-importance>=0.0.6",
  "captum>=0.8.0",
  "dice-ml>=0.12",
  "imodels>=2.0.4",
  "alibi>=0.9.6",
  "skope-rules>=1.0.1",
  "openpyxl>=3.1.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
xai = "xai_decision_making.main:main"
